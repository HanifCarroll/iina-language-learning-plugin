<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <div id="wrap">
      <div id="translation"></div>
      <div id="source-line">
        <div id="cue" data-clickable="true"></div>
        <button id="explain-line" type="button" data-clickable="true" hidden>
          <span aria-hidden="true">✧</span> Explain line
        </button>
      </div>
    </div>
    <section id="word-card" data-clickable="true" aria-label="Word meaning" hidden>
      <div class="word-card-heading">
        <strong id="word-card-word"></strong>
        <button
          id="word-card-close"
          data-clickable="true"
          type="button"
          aria-label="Close word meaning"
        >
          ×
        </button>
      </div>
      <p id="word-card-meaning" role="status"></p>
      <div id="word-card-alternatives" hidden>
        <p id="word-card-alternative-list"></p>
      </div>
    </section>
    <script src="overlay.js"></script>
  </body>
</html>
